name: Сбор и перевод новостей

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.json'
      - '.github/workflows/news.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание файлов репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: pip install feedparser openai requests

      - name: Запуск скрипта сбора новостей
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch_news.py

      - name: Сохранение обновленного news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Обновление новостей"
            git pull --rebase origin main
            git push
          fi
