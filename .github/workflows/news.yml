name: Сбор и перевод новостей

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.json'
      - 'fetch_news.py'
      - '.github/workflows/news.yml'

permissions:
  contents: write
  models: read

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание файлов репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: pip install feedparser openai requests

      - name: Запуск скрипта сбора новостей
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_news.py

      - name: Сохранение обновленного news.json
        run: | git config --local user.email "action@github.com" git config --local user.name "GitHub Action" git add news.json git diff --quiet && git diff --staged --quiet || (git commit -m "Обновление новостей" && git push)
