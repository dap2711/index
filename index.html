<div id="om"><div class="cbox"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="omt"></b><button type="button" class="cl" id="omx" aria-label="Закрыть">✕</button></div><div id="omb"></div></div></div>
<div id="am"><div class="cbox"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Запись аудио</b><button type="button" class="cl" id="amx" aria-label="Закрыть">✕</button></div><div class="mu">Нажмите кнопку, чтобы начать запись, и ещё раз, чтобы остановить. Запись добавится к напоминанию.</div><div class="row" style="margin-top:12px"><button type="button" id="rb">🎙 Записать аудио</button><span id="rt" class="rec"></span></div>
<label class="row" style="margin-top:12px;gap:8px;flex-wrap:nowrap"><input type="checkbox" id="dsw" checked style="width:auto"><span>Записывать текст речи в заметку</span></label><div id="dst" class="mu" style="margin-top:6px"></div></div></div>
<div id="dm"><div class="cbox dbox"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Напоминание</b><span class="row" style="gap:4px"><button type="button" id="dal" title="Спросить Алису (Яндекс)" aria-label="Спросить Алису">🟣</button><button type="button" id="dgm" title="Спросить Gemini" aria-label="Спросить Gemini">✨</button><button type="button" id="dpar" title="Редактировать" aria-label="Редактировать">✏️</button><button type="button" class="cl" id="dmx" aria-label="Закрыть">✕</button></span></div><div id="dmb"></div></div></div>
<div id="cm"><div class="cbox"><div class="row" style="justify-content:space-between;margin-bottom:8px"><button type="button" id="cpv" aria-label="Предыдущий месяц">‹</button><b id="cmt"></b><button type="button" id="cnx" aria-label="Следующий месяц">›</button></div><div class="cg mu" style="margin-bottom:4px"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="cg" id="cgd"></div><div class="row" style="justify-content:space-between;margin-top:10px"><button type="button" id="cnd">Без даты</button><button type="button" id="cx">Закрыть</button></div></div></div>
<div id="bar"><button type="button" id="vb2" title="Голосовая запись" aria-label="Голосовая запись">🎙 Запись</button><button type="button" class="p" id="nb">＋ Новое</button></div>
<script>

const $=s=>document.querySelector(s);
const K=k=>k.startsWith('nap_')?k:'nap_'+k;
const ls={get(k,d){try{const v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}};
let items=ls.get('items',[]),cats=ls.get('cats',['Работа','Дом','Здоровье','Учёба','Покупки']),gone=ls.get('gone',{});
let view={t:'all',v:''},pend=[],keep=[],drop=[],editId=null,rec=null,tick=null,sdoc=null,dueIds=new Set();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* файлы */
const mem={};let dbp=null;
function db(){return dbp||(dbp=new Promise(r=>{try{const o=indexedDB.open('nap',1);o.onupgradeneeded=()=>o.result.createObjectStore('b');o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}}))}
async function put(id,b){const d=await db();if(!d){mem[id]=b;return}return new Promise(r=>{try{const t=d.transaction('b','readwrite');t.objectStore('b').put(b,id);t.oncomplete=r;t.onerror=()=>{mem[id]=b;r()}}catch(e){mem[id]=b;r()}})}
async function get(id){if(mem[id])return mem[id];const d=await db();if(!d)return null;return new Promise(r=>{try{const q=d.transaction('b').objectStore('b').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function del(id){delete mem[id];const d=await db();if(d)try{d.transaction('b','readwrite').objectStore('b').delete(id)}catch(e){}}
/* синхронизация */
let pt=null;
const payload=()=>JSON.stringify({items,gone,cats});
function save(){ls.set('items',items);ls.set('cats',cats);ls.set('gone',gone);clearTimeout(pt);pt=setTimeout(push,700)}
async function push(){if(!sdoc)return;try{await sdoc.set({p:payload()});sy(1)}catch(e){sy(0)}}
function sy(ok){$('#sy').textContent=ok?'☁ Синхронизировано':'Только на этом устройстве'}
function merge(rm){
Object.entries(rm.gone||{}).forEach(([id,ts])=>{gone[id]=Math.max(gone[id]||0,ts)});
const map={};items.forEach(r=>map[r.id]=r);
(rm.items||[]).forEach(r=>{if(!map[r.id]||(r.u||0)>(map[r.id].u||0))map[r.id]=r});
items=Object.values(map).filter(r=>!(gone[r.id]&&gone[r.id]>=(r.u||0))).sort((a,b)=>b.id.localeCompare(a.id));
cats=[...new Set([...cats,...(rm.cats||[])])];}
async function initSync(){
try{if(!window.claude||!claude.use)return;
const c=await claude.use('db'),u=await claude.use('user');if(!c||!u)return;
const id=await u.id();if(!id)return;
sdoc=c.collection('data/users/'+id).doc('state');
sdoc.onSnapshot(s=>{sy(1);const rp=s.exists?s.data().p:null;if(rp){try{merge(JSON.parse(rp))}catch(e){}}
ls.set('items',items);ls.set('cats',cats);ls.set('gone',gone);render();if(payload()!==rp)push()},()=>sy(0));
}catch(e){}}
/* запись */
$('#rb').onclick=async()=>{
if(rec){rec.stop();return}
try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];rec=new MediaRecorder(st);const t0=Date.now();
rec.ondataavailable=e=>ch.push(e.data);
rec.onstop=()=>{dictStop();st.getTracks().forEach(t=>t.stop());clearInterval(tick);$('#rt').textContent='';$('#rb').textContent='🎙 Записать аудио';
const blob=new Blob(ch,{type:rec.mimeType||'audio/webm'});
pend.push({id:'f'+Date.now(),name:'Запись '+new Date().toLocaleString('ru-RU'),type:blob.type,blob});rec=null;showPend()};
rec.start();$('#rb').textContent='⏹ Остановить';if($('#dsw')&&$('#dsw').checked)dictStart();
tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#rt').textContent='● '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500)
}catch(e){alert('Нет доступа к микрофону. Разрешите его в настройках браузера.')}};
$('#fl').onchange=e=>{[...e.target.files].forEach((f,i)=>pend.push({id:'f'+Date.now()+i,name:f.name,type:f.type,blob:f}));e.target.value='';showPend()};
function showPend(){$('#pend').innerHTML=pend.map((p,i)=>`<span class="fi"><span class="fit">${p.lk?(isMap(p.lk)?'📍 ':'🔗 '):(p.type||'').startsWith('audio')?'🎙 ':'📎 '}${esc(p.lk?p.lk.replace(/^https?:\/\//,''):p.name)}</span><button data-i="${i}" aria-label="Убрать">✕</button></span>`).join('');
$('#pend').querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=pend.splice(+b.dataset.i,1)[0];if(p&&p.old)drop.push(p);showPend();icons()})}
/* форма */
const pad=n=>String(n).padStart(2,'0');
const loc=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function fillCats(sel){$('#ct').innerHTML='<option value="">Без категории</option>'+cats.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new">＋ Новая категория…</option>'}
$('#ct').onchange=()=>{if($('#ct').value==='__new'){const n=(prompt('Название категории:')||'').trim();if(n&&!cats.includes(n)){cats.push(n);save()}fillCats(n);render()}};

const MN=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'],WD=['вс','пн','вт','ср','чт','пт','сб'];
const IM=[['⚪','Обычное'],['⭐','Важное'],['🔥','Срочное']];
const SL={1:'Утро',2:'Работа',3:'День',4:'Садик',5:'Вечер'};
let selD=loc(new Date()).slice(0,10),catF='';
const isWE=d=>{const w=new Date(d+'T00:00').getDay();return w===0||w===6};
function picker(el,cur,dots,pick){
const y=+cur.slice(0,4),m=+cur.slice(5,7)-1,y0=new Date().getFullYear(),ys=[...new Set([y0,y0+1,y])].sort(),days=new Date(y,m+1,0).getDate(),t0=loc(new Date()).slice(0,10);
let ds='';for(let d=1;d<=days;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`;ds+=`<button type="button" class="dy ${k===cur?'on':''} ${k===t0?'td':''}" data-d="${k}"><b>${d}</b><small>${WD[new Date(y,m,d).getDay()]}</small>${dots&&dots[k]?'<i class="dt"></i>':''}</button>`}
const tk=n=>loc(new Date(Date.now()+n*864e5)).slice(0,10);let q2='';
[['сегодня',0],['завтра',1]].forEach(([l,n])=>{const k=tk(n);q2+=`<button type="button" class="dy qk ${k===cur?'on':''}" data-d="${k}"><b>${+k.slice(8,10)}</b><small>${l}</small>${dots&&dots[k]?'<i class="dt"></i>':''}</button>`});
el.innerHTML=`<div class="pk"><div class="qkw">${q2}</div><div class="strip ds">${ds}<span class="sep"></span>${MN.map((n,i)=>`<button type="button" class="ch ${i===m?'on':''}" data-m="${i}">${n}</button>`).join('')}<span class="sep"></span>${ys.map(v=>`<button type="button" class="ch ${v===y?'on':''}" data-y="${v}">${v}</button>`).join('')}</div></div>`;
const mv=(yy,mm)=>pick(`${yy}-${pad(mm+1)}-${pad(Math.min(+cur.slice(8,10),new Date(yy,mm+1,0).getDate()))}`);
el.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>mv(+b.dataset.y,m));
el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>mv(y,+b.dataset.m));
el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>pick(b.dataset.d));
const sc=el.querySelector('.ds'),on=el.querySelector('.dy:not(.qk).on');if(sc&&on)sc.scrollLeft=Math.max(0,on.offsetLeft-4)}
const cal={d:'',n:0,imp:0,raw:'09:00',mt:'',me:''};
function calUI(){
$('#wh').value=cal.d?cal.d+'T'+cal.raw:'';
const we=cal.d&&isWE(cal.d);if(we&&(cal.n===2||cal.n===4))cal.n=3;
$('#sl').innerHTML='<option value="0">Раздел дня</option>'+[1,2,3,4,5].filter(n=>!we||(n!==2&&n!==4)).map(n=>`<option value="${n}">${SL[n]}</option>`).join('');
$('#sl').value=String(cal.n);
$('#ib').textContent=cal.imp?'⭐':'☆';$('#ib').title=cal.imp?'Важное: включено':'Важное: выключено';$('#ib').classList.toggle('on',!!cal.imp);$('#bc').disabled=!!cal.imp;$('#bs').disabled=!!cal.imp||!cal.d;$('#br').disabled=!cal.d;$('#ib').disabled=!cal.d;$('#bt').disabled=!cal.d;$('#db').classList.toggle('on',!cal.d);icons()}
function calSet(w,n,imp){cal.n=w?(n||0):(n||3);cal.imp=imp?1:0;if(cal.imp)cal.n=0;cal.mt='';cal.me=ls.get('nap_mail','');cal.d=w?w.slice(0,10):selD;cal.raw='09:00';calUI()}
$('#sl').onchange=()=>{cal.n=+$('#sl').value};
$('#ib').onclick=()=>{cal.imp=cal.imp?0:1;if(cal.imp){cal.n=0;fillCats('')}else if(!cal.n)cal.n=3;calUI()};
let cv={y:0,m:0};
function openCal(){const bd=cal.d||loc(new Date()).slice(0,10);cv.y=+bd.slice(0,4);cv.m=+bd.slice(5,7)-1;cmUI();$('#cm').classList.add('open')}
function cmUI(){const off=(new Date(cv.y,cv.m,1).getDay()+6)%7,days=new Date(cv.y,cv.m+1,0).getDate(),t0=loc(new Date()).slice(0,10);
let c='<span></span>'.repeat(off);for(let d=1;d<=days;d++){const k=`${cv.y}-${pad(cv.m+1)}-${pad(d)}`;c+=`<button type="button" class="cd ${k===cal.d?'on':''} ${k===t0?'td':''}" data-d="${k}">${d}</button>`}
const mn=MN2[cv.m]+' '+cv.y;
$('#cmt').textContent=mn;$('#cgd').innerHTML=c;
$('#cgd').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{cal.d=b.dataset.d;if(!cal.n&&!cal.imp)cal.n=3;calUI();$('#cm').classList.remove('open')})}
$('#cpv').onclick=()=>{cv.m--;if(cv.m<0){cv.m=11;cv.y--}cmUI()};
$('#cnx').onclick=()=>{cv.m++;if(cv.m>11){cv.m=0;cv.y++}cmUI()};
$('#cnd').onclick=()=>{cal.d='';cal.n=0;cal.imp=0;cal.mt='';$('#rp').value='';rcShow();if(!$('#ct').value||$('#ct').value==='__new')fillCats('Входящие');$('#cm').classList.remove('open');calUI()};
$('#cx').onclick=()=>$('#cm').classList.remove('open');
$('#cm').onclick=e=>{if(e.target.id==='cm')$('#cm').classList.remove('open')};
$('#db').onclick=openCal;

function rcShow(){$('#rc').style.display=$('#rp').value==='n'?'flex':'none'}
$('#rp').onchange=rcShow;


function icons(){const c=$('#ct').value==='__new'?'':$('#ct').value,n=+$('#sl').value||0,rp=$('#rp').value;
$('#bc').classList.toggle('on',!!c);$('#bs').classList.toggle('on',!!n);$('#br').classList.toggle('on',!!rp);
const rt=rp?repTxt({repeat:rp,rn:+$('#rn').value||1,ru:$('#ru').value}):'';
const au=f=>(f.type||'').startsWith('audio'),fs=pend.filter(f=>!f.lk);
$('#bl').classList.toggle('on',pend.some(f=>f.lk&&!isMap(f.lk)));$('#bp').classList.toggle('on',pend.some(f=>f.lk&&isMap(f.lk)));$('#bt').classList.toggle('on',!!cal.mt);$('#bf').classList.toggle('on',fs.some(f=>!au(f)));$('#bm').classList.toggle('on',!!rec||fs.some(au));
$('#sum').textContent=[c?catLabel(c):'',n?SL[n]:'',rt,cal.mt?'✉ '+cal.mt:'',cal.d?shD(cal.d):'без даты'].filter(Boolean).join(' · ')}
function optModal(title,opts,cur,fn,extra){$('#omt').textContent=title;
$('#omb').innerHTML=opts.map(o=>`<button type="button" class="nv ${o[0]===cur?'on':''}" data-v="${esc(o[0])}"><span>${o[2]?o[2]+' ':''}${esc(o[1])}</span><span>${o[0]===cur?'✓':''}</span></button>`).join('')+(extra||'');
$('#omb').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{fn(b.dataset.v);$('#om').classList.remove('open')});
$('#om').classList.add('open')}
$('#omx').onclick=()=>$('#om').classList.remove('open');
$('#om').onclick=e=>{if(e.target.id==='om')$('#om').classList.remove('open')};
$('#bc').onclick=()=>optModal('Категория',[['','Без категории'],...cats.map(c=>[c,catLabel(c),catIcon(c)]),['__new','＋ Новая категория…']],$('#ct').value==='__new'?'':$('#ct').value,v=>{
if(v==='__new'){setTimeout(()=>newCatModal(n=>{fillCats(n);icons();render()}),0);return}fillCats(v);icons();render()});
$('#bs').onclick=()=>{const we=isWE(cal.d);optModal('Раздел дня',[...[1,2,3,4,5].filter(n=>!we||(n!==2&&n!==4)).map(n=>[String(n),SL[n],SI[n]])],String(cal.n),v=>{cal.n=+v;calUI()},we?'<div class="mu" style="margin-top:8px">В субботу и воскресенье доступны утро, день и вечер.</div>':'')};
$('#br').onclick=()=>{const cur=$('#rp').value,U=[['d','дней'],['w','недель'],['mo','месяцев'],['y','лет']];
const x=`<div class="row" style="margin-top:10px"><span class="mu">Свой интервал: каждые</span><input id="mrn" type="number" min="1" max="999" value="${+$('#rn').value||1}" style="width:80px"><select id="mru" style="width:auto">${U.map(u=>`<option value="${u[0]}" ${u[0]===$('#ru').value?'selected':''}>${u[1]}</option>`).join('')}</select><button type="button" class="p" id="mra">Применить</button></div>`;
optModal('Повторение',[['','Не повторять'],['d','Каждый день'],['wd','По будням'],['w','Каждую неделю'],['m','Каждый месяц'],['y','Каждый год']],cur==='n'?'x':cur,v=>{$('#rp').value=v;rcShow();icons()},x);
$('#mra').onclick=()=>{$('#rp').value='n';$('#rn').value=Math.max(1,+$('#mrn').value||1);$('#ru').value=$('#mru').value;rcShow();icons();$('#om').classList.remove('open')}};

function winModal(title,html){$('#omt').textContent=title;$('#omb').innerHTML=html;$('#om').classList.add('open')}
$('#bl').onclick=()=>{
winModal('Ссылки на видео или музыку',`<input id="mln" placeholder="https://…"><div class="row" style="margin-top:10px;justify-content:flex-end"><button type="button" id="mla">Добавить</button><button type="button" class="p" id="mlo">Готово</button></div><div id="mll" style="margin-top:10px"></div>`);
const redraw=()=>{$('#mll').innerHTML=pend.map((p,i)=>p.lk&&!isMap(p.lk)?`<div class="row" style="flex-wrap:nowrap;justify-content:space-between"><span class="mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1">${esc(p.lk)}</span><button type="button" class="x" data-i="${i}" aria-label="Убрать">✕</button></div>`:'').join('');
$('#mll').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{pend.splice(+b.dataset.i,1);showPend();icons();redraw()})};
const add=()=>{const u=$('#mln').value.trim();if(!u)return;u.split(/\s+/).filter(Boolean).forEach(x=>pend.push({lk:/^https?:\/\//i.test(x)?x:'https://'+x}));$('#mln').value='';showPend();icons();redraw()};
$('#mla').onclick=add;$('#mln').onkeydown=e=>{if(e.key==='Enter')add()};
$('#mlo').onclick=()=>{add();$('#om').classList.remove('open')};redraw();$('#mln').focus()};

$('#bt').onclick=()=>{winModal('Письмо с напоминанием',`<div class="mu" style="margin-bottom:8px">В это время на почту придёт письмо с названием напоминания.</div><input id="mtt" type="time" value="${cal.mt||'09:00'}"><input id="mte" type="email" placeholder="Электронная почта" value="${esc(cal.me)}" style="margin-top:8px"><div class="mu" style="margin-top:8px">${mcfg()?'Письмо придёт на почту владельца скрипта в назначенное время.':'Чтобы письма отправлялись, подключите скрипт (раздел ниже).'}</div><details style="margin-top:8px"><summary>Подключение отправки (Google Apps Script)</summary><input id="mcu" placeholder="Адрес скрипта: https://script.google.com/macros/s/…/exec" value="${esc((mcfg()||{}).url||'')}" style="margin-top:8px"><input id="mcs" placeholder="Секрет" value="${esc((mcfg()||{}).secret||'')}" style="margin-top:8px"></details><div class="row" style="margin-top:10px;justify-content:space-between"><button type="button" id="mtc">Убрать</button><button type="button" class="p" id="mts">Установить</button></div>`);
$('#mts').onclick=()=>{const e=$('#mte').value.trim();if(e&&!/^\S+@\S+\.\S+$/.test(e)){$('#mte').focus();return}cal.mt=$('#mtt').value||'09:00';cal.me=e;try{localStorage.setItem('nap_mail',JSON.stringify(e))}catch(x){}const u=$('#mcu').value.trim(),sc=$('#mcs').value.trim();if(u&&sc)ls.set('nap_mailcfg',{url:u,secret:sc});else if(!u&&!sc)ls.set('nap_mailcfg',null);$('#om').classList.remove('open');calUI();mailSync()};
$('#mtc').onclick=()=>{cal.mt='';$('#om').classList.remove('open');calUI()}};
$('#bp').onclick=()=>{winModal('Место на Яндекс Картах',`<div class="mu" style="margin-bottom:8px">Вставьте координаты (например, 55.7558, 37.6173) или ссылку на организацию или точку из Яндекс Карт.</div><input id="mpl" placeholder="55.7558, 37.6173 или https://yandex.ru/maps/…"><div class="row" style="margin-top:10px;justify-content:flex-end"><button type="button" class="p" id="mpa">Добавить</button></div><div id="mpe" style="color:var(--rd);margin-top:6px"></div>`);
const add=()=>{const u=toMapUrl($('#mpl').value);if(!u){$('#mpe').textContent='Не удалось распознать: нужны координаты или ссылка.';return}pend.push({lk:u});showPend();icons();$('#om').classList.remove('open')};
$('#mpa').onclick=add;$('#mpl').onkeydown=e=>{if(e.key==='Enter')add()};$('#mpl').focus()};

/* письма через Google Apps Script */
const mcfg=()=>{const c=ls.get('nap_mailcfg',null);return c&&c.url&&c.secret?c:null};
let mailT=null;
function mailSync(){clearTimeout(mailT);mailT=setTimeout(doMail,1500)}
async function doMail(){const c=mcfg();if(!c)return;const prev=ls.get('nap_mailpushed',{}),now={};
const post=d=>fetch(c.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...d,secret:c.secret})}).catch(()=>{});

<script>
/* Синхронизация через Google Drive (скрытая папка приложения) */
(function(){
const CID='474666681590-4i5l44rl6aruapqjkb08ahl4eqbiskug.apps.googleusercontent.com',SC='https://www.googleapis.com/auth/drive.appdata';
const btn=document.getElementById('cld');let tok=null,tokExp=0,client=null,busy=false,again=false,timer=null;
const flag=()=>{try{return localStorage.getItem('nap_drive')==='1'}catch(e){return false}};
const ui=(t,h)=>{btn.textContent=t;btn.title=h};
function gis(){return new Promise((res,rej)=>{let n=0;const iv=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(iv);res()}else if(++n>100){clearInterval(iv);rej(new Error('нет связи с Google'))}},100)})}
function token(mode){return new Promise(async(res,rej)=>{
 if(tok&&Date.now()<tokExp-60000)return res(tok);
 try{await gis()}catch(e){return rej(e)}
 if(!client)client=google.accounts.oauth2.initTokenClient({client_id:CID,scope:SC,callback:()=>{}});
 client.callback=r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;tokExp=Date.now()+(r.expires_in||3600)*1000;try{localStorage.setItem('nap_drive','1')}catch(e){}res(tok)};
 client.error_callback=e=>rej(new Error((e&&e.type)||'окно входа закрыто'));
 client.requestAccessToken({prompt:mode==='interactive'?'':'none'})})}
async function api(path,opt){opt=opt||{};const t=await token('silent');
 const r=await fetch('https://www.googleapis.com'+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
 if(r.status===401){tok=null;throw new Error('нужен повторный вход')}
 if(!r.ok)throw new Error('Drive '+r.status);return r}
async function listFiles(){let out=[],pt='';do{const r=await api('/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)'+(pt?'&pageToken='+pt:''));const j=await r.json();out=out.concat(j.files||[]);pt=j.nextPageToken||''}while(pt);return out}
async function upload(name,blob,type,id){const meta=id?{}:{name,parents:['appDataFolder']},b='nap'+Math.random().toString(36).slice(2);
 const body=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: '+type+'\r\n\r\n',blob,'\r\n--'+b+'--']);
 return api((id?'/upload/drive/v3/files/'+id:'/upload/drive/v3/files')+'?uploadType=multipart',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})}
async function sync(){if(busy){again=true;return}busy=true;ui('⏳','Синхронизация…');
 try{
  const files=await listFiles(),st=files.find(f=>f.name==='state.json');
  if(st){const r=await api('/drive/v3/files/'+st.id+'?alt=media'),txt=await r.text();try{merge(JSON.parse(txt))}catch(e){}ls.set('items',items);ls.set('cats',cats);ls.set('gone',gone);render()}
  await upload('state.json',new Blob([JSON.stringify({items,gone,cats})]),'application/json',st&&st.id);
  const have=new Set(files.map(f=>f.name)),all=items.flatMap(r=>r.files),ids=[...new Set(all.map(f=>f.id))];
  for(const id of ids){const nm='f_'+id,blob=await get(id);
   if(blob&&!have.has(nm)){const m=all.find(f=>f.id===id);await upload(nm,blob,(m&&m.type)||'application/octet-stream')}
   else if(!blob&&have.has(nm)){const f=files.find(x=>x.name===nm),r=await api('/drive/v3/files/'+f.id+'?alt=media');await put(id,await r.blob())}}
  render();ui('☁','Синхронизировано в '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){ui('⚠','Ошибка: '+e.message+'. Нажмите, чтобы повторить')}
 busy=false;if(again){again=false;sched(1500)}}
function sched(ms){clearTimeout(timer);timer=setTimeout(()=>{if(flag())sync()},ms)}
btn.onclick=async()=>{try{await token('interactive');sync()}catch(e){ui('⚠','Не удалось войти: '+e.message)}};
{const _s=save;save=function(){_s();if(flag())sched(3000)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&flag())sched(800)});
setInterval(()=>{if(flag()&&document.visibilityState==='visible')sched(100)},180000);
if(flag()){ui('☁','Вход в Google Drive…');token('silent').then(()=>sync()).catch(()=>ui('☁','Нажмите, чтобы войти в Google и включить синхронизацию'))}
else ui('☁','Нажмите, чтобы включить синхронизацию с Google Drive');
})();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
