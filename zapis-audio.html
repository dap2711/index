<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><title>Аудио-запись</title><style>
:root{--bg:#fff;--card:#f4f6f3;--tx:#1b1f1c;--mu:#6a736d;--ac:#2e7d5b;--rd:#d93025;--bd:#dfe4de;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2621;--tx:#e6efe9;--mu:#9baba1;--ac:#4cc79a;--rd:#ff6b61;--bd:#2c3b33;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Roboto,"Segoe UI",system-ui,sans-serif;padding:max(8px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top a{padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);text-decoration:none;font-weight:700}
.top a.on{background:var(--ac);border-color:var(--ac);color:#fff}
h1{font-size:20px;margin:6px 0 4px}.hint{color:var(--mu);margin-bottom:12px}
.big{display:block;width:100%;height:30vh;min-height:150px;border:0;border-radius:24px;background:var(--ac);color:#fff;font-family:inherit;font-weight:700;font-size:clamp(22px,6vw,32px);line-height:1.2;padding:12px;margin-bottom:12px;cursor:pointer}
.big.rec{background:var(--rd);animation:pl 1.3s ease-in-out infinite}
.big.sm{height:10vh;min-height:50px;font-size:clamp(18px,5vw,24px);border-radius:16px}
.big.alt{background:var(--card);color:var(--tx);border:2px solid var(--ac)}
@keyframes pl{50%{opacity:.78}}@media (prefers-reduced-motion:reduce){.big.rec{animation:none}}
.small{padding:10px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
audio{width:100%;margin-bottom:12px}
textarea{width:100%;min-height:30vh;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;padding:14px;margin-bottom:12px;resize:vertical}
.msg{min-height:1.5em;font-weight:700;color:var(--ac)}.msg.err{color:var(--rd)}
.panel{position:fixed;inset:0;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 14px 14px;overflow:auto;z-index:5}
.panel[hidden],[hidden]{display:none!important}
</style><link rel="manifest" href="manifest-audio.json"><link rel="icon" href="icons/icon-audio-192.png"><link rel="apple-touch-icon" href="icons/icon-audio-180.png"><meta name="theme-color" content="#2e7d5b"></head><body><div id="root"><button type="button" class="big x-big">🎙 Записать</button>
<div class="x-after" hidden><audio class="x-pv" controls></audio><button type="button" class="big x-save">Сохранить</button><button type="button" class="small x-again">Записать заново</button></div>
<div class="msg x-msg" role="status"></div></div><script>
const P='';
const lg=(k,d)=>{try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const numOf=(t,pre)=>{if(t.startsWith(pre+' ')){const m=t.slice(pre.length+1).match(/^(\d+)/);return m?+m[1]:0}return(pre==='Запись'&&/^\d+$/.test(t))?+t:0};
const nextNum=pre=>Math.max(0,...lg('items',[]).filter(r=>r.cat==='Входящие').map(r=>numOf(r.title,pre)))+1;
function idb(){return new Promise(res=>{try{const o=indexedDB.open('nap',1);o.onupgradeneeded=()=>{if(!o.result.objectStoreNames.contains('b'))o.result.createObjectStore('b')};o.onsuccess=()=>res(o.result);o.onerror=()=>res(null)}catch(e){res(null)}})}
async function putBlob(id,blob){const d=await idb();if(!d)throw new Error('хранилище браузера недоступно');return new Promise((res,rej)=>{const t=d.transaction('b','readwrite');t.objectStore('b').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
/* запись в Напоминалку: сегодня, категория «Входящие», раздел «Входящие»; название «Запись 3 · 14:25» или «Заметка 2 · 14:25» */
async function addReminder(pre,notes,blob,at){
 const items=lg('items',[]);let cats=lg('cats',null);if(!cats)cats=['Работа','Дом','Здоровье','Учёба','Покупки'];if(!cats.includes('Входящие'))cats.push('Входящие');
 const n=nextNum(pre),title=pre+' '+n+' · '+hm(at||new Date()),id='r'+Date.now()+Math.floor(Math.random()*1000),files=[],att=[];
 if(blob){const fid='f'+Date.now()+Math.floor(Math.random()*1000);await putBlob(fid,blob);files.push({id:fid,name:title,type:blob.type||'audio/webm'});att.push({t:'f',id:fid})}
 items.unshift({id,title,text:notes[0]||'',notes,when:today()+'T09:00',cat:'Входящие',num:0,imp:0,repeat:'',rn:1,ru:'d',done:false,links:[],files,att,tags:[],mt:'',me:'',u:Date.now()});
 lset('items',items);lset('cats',cats);lset('dirty',1);return title}

function initAudio(R){const q=s=>R.querySelector(s);let rec=null,chunks=[],blob=null,t0=0,at=null,iv=null,stream=null;
const fmt=s=>Math.floor(s/60)+':'+pad(s%60),msg=(t,e)=>{q('.x-msg').textContent=t;q('.x-msg').className='msg x-msg'+(e?' err':'')};
function idle(){const b=q('.x-big');b.hidden=false;b.className='big x-big';b.textContent='🎙 Записать';q('.x-after').hidden=true}
q('.x-big').onclick=async()=>{
 if(rec){rec.stop();return}
 msg('');
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){msg('Нет доступа к микрофону. Разрешите его в настройках браузера.',1);return}
 chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(iv);blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;q('.x-big').hidden=true;q('.x-after').hidden=false;q('.x-pv').src=URL.createObjectURL(blob)};
 rec.start();t0=Date.now();at=new Date();const b=q('.x-big');b.className='big rec x-big';b.textContent='⏹ 0:00 — нажмите, чтобы остановить';
 iv=setInterval(()=>{b.textContent='⏹ '+fmt(Math.floor((Date.now()-t0)/1000))+' — нажмите, чтобы остановить'},300)};
q('.x-save').onclick=async()=>{if(!blob)return;try{const t=await addReminder('Запись',[],blob,at);blob=null;idle();msg('✓ Сохранено: '+t)}catch(e){msg('Не удалось сохранить: '+e.message,1)}};
q('.x-again').onclick=()=>{blob=null;idle();msg('')};
idle()}
initAudio(document.getElementById('root'));</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
