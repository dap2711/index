<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #d0d7de;
      background: #ffffff;
      color: #1f2328;
      text-decoration: none;
      font-size: 18px;
    }
    .tab-btn {
      border: 1px solid #d0d7de;
      background: #ffffff;
      color: #1f2328;
      border-radius: 18px;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #225c3b;
      color: #ffffff;
      border-color: #225c3b;
    }
    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #225c3b;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card-wrap {
      position: relative;
      margin-bottom: 12px;
      border-radius: 14px;
      overflow: hidden;
      background: #eaf3ee;
    }
    .swipe-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 18px;
      font-weight: 600;
      color: #225c3b;
      pointer-events: none;
    }
    .card {
      position: relative;
      background: #f6f6f4;
      border-radius: 14px;
      padding: 15px 16px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      touch-action: pan-y;
    }
    .card.is-read {
      opacity: 0.55;
    }
    .title-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .desktop-icons {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    @media (hover: none) and (pointer: coarse) {
      .desktop-icons {
        display: none;
      }
    }
    .icon-btn {
      background: none;
      border: none;
      padding: 2px 4px;
      cursor: pointer;
      font-size: 15px;
      color: #8c959f;
      line-height: 1;
    }
    .icon-btn.active-read {
      color: #225c3b;
    }
    .icon-btn.active-fav {
      color: #d4a017;
    }
    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      color: #1f2328;
    }
    .card-summary {
      margin: 0 0 10px 0;
      font-size: 14px;
      line-height: 1.45;
      color: #32383f;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .orig-link {
      font-size: 13px;
      color: #225c3b;
      text-decoration: none;
      font-weight: 500;
    }
    .orig-link:hover {
      text-decoration: underline;
    }
    .empty {
      text-align: center;
      color: #656d76;
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="menu-btn" title="На главную">☰</a>
      <button class="tab-btn active" id="tab-all" onclick="setTab('all')">Все новости</button>
      <button class="tab-btn" id="tab-fav" onclick="setTab('fav')">Сохранённые (<span id="fav-count">0</span>)</button>
      <button class="tab-btn" id="tab-unread" onclick="toggleHideRead()">Скрыть прочитанные</button>
    </div>

    <div class="section-label">НОВОСТИ</div>
    <div id="news-list" class="empty">Загрузка новостей...</div>
  </div>

  <script>
    let allNews = [];
    let currentTab = 'all';
    let hideRead = false;

    const getRead = () => JSON.parse(localStorage.getItem('news_read') || '[]');
    const getFavs = () => JSON.parse(localStorage.getItem('news_favs') || '[]');

    function toggleRead(url) {
      let read = getRead();
      if (read.includes(url)) {
        read = read.filter(u => u !== url);
      } else {
        read.push(url);
      }
      localStorage.setItem('news_read', JSON.stringify(read));
      render();
    }

    function markRead(url) {
      let read = getRead();
      if (!read.includes(url)) {
        read.push(url);
        localStorage.setItem('news_read', JSON.stringify(read));
        render();
      }
    }

    function toggleFav(item) {
      let favs = getFavs();
      const idx = favs.findIndex(f => f.url === item.url);
      if (idx >= 0) {
        favs.splice(idx, 1);
      } else {
        favs.unshift(item);
      }
      localStorage.setItem('news_favs', JSON.stringify(favs));
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tab-all').classList.toggle('active', tab === 'all');
      document.getElementById('tab-fav').classList.toggle('active', tab === 'fav');
      render();
    }

    function toggleHideRead() {
      hideRead = !hideRead;
      document.getElementById('tab-unread').classList.toggle('active', hideRead);
      render();
    }

    function render() {
      const container = document.getElementById('news-list');
      const readList = getRead();
      const favList = getFavs();
      document.getElementById('fav-count').textContent = favList.length;

      let list = currentTab === 'fav' ? favList : allNews;
      if (hideRead && currentTab === 'all') {
        list = list.filter(i => !readList.includes(i.url));
      }

      if (!list.length) {
        container.className = 'empty';
        container.textContent = currentTab === 'fav' ? 'Нет сохранённых новостей.' : 'Нет новостей для отображения.';
        return;
      }

      container.className = '';
      container.innerHTML = '';

      list.forEach(item => {
        const isRead = readList.includes(item.url);
        const isFav = favList.some(f => f.url === item.url);

        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';

        const bg = document.createElement('div');
        bg.className = 'swipe-bg';
        bg.innerHTML = '<span>✓</span><span>★</span>';

        const card = document.createElement('article');
        card.className = 'card' + (isRead ? ' is-read' : '');

        const titleRow = document.createElement('div');
        titleRow.className = 'title-row';

        const icons = document.createElement('div');
        icons.className = 'desktop-icons';

        const btnRead = document.createElement('button');
        btnRead.className = 'icon-btn' + (isRead ? ' active-read' : '');
        btnRead.textContent = '✓';
        btnRead.title = 'Прочитано';
        btnRead.onclick = () => toggleRead(item.url);

        const btnFav = document.createElement('button');
        btnFav.className = 'icon-btn' + (isFav ? ' active-fav' : '');
        btnFav.textContent = isFav ? '★' : '☆';
        btnFav.title = 'В избранное';
        btnFav.onclick = () => toggleFav(item);

        icons.appendChild(btnRead);
        icons.appendChild(btnFav);

        const h2 = document.createElement('h2');
        h2.className = 'card-title';
        h2.textContent = item.title;

        titleRow.appendChild(icons);
        titleRow.appendChild(h2);

        const p = document.createElement('p');
        p.className = 'card-summary';
        p.textContent = item.summary;

        const a = document.createElement('a');
        a.className = 'orig-link';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Читать оригинал →';
        a.onclick = () => markRead(item.url);

        card.appendChild(titleRow);
        card.appendChild(p);
        card.appendChild(a);

        // Touch swipe gestures
        let startX = 0;
        let currentX = 0;
        card.addEventListener('touchstart', e => {
          startX = e.touches[0].clientX;
          card.style.transition = 'none';
        }, { passive: true });

        card.addEventListener('touchmove', e => {
          currentX = e.touches[0].clientX - startX;
          if (Math.abs(currentX) > 10) {
            card.style.transform = `translateX(${Math.max(-90, Math.min(90, currentX))}px)`;
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          card.style.transition = 'transform 0.2s ease';
          card.style.transform = 'translateX(0)';
          if (currentX > 65) {
            toggleRead(item.url);
          } else if (currentX < -65) {
            toggleFav(item);
          }
          currentX = 0;
        });

        wrap.appendChild(bg);
        wrap.appendChild(card);
        container.appendChild(wrap);
      });
    }

    async function init() {
      try {
        const res = await fetch('news.json?t=' + Date.now());
        allNews = await res.json();
      } catch (e) {
        allNews = [];
      }
      render();
    }
    init();
  </script>
</body>
</html>
