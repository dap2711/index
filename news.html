<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента новостей</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f6f6f4;
      --accent: #225c3b;
      --accent-light: #e8f1ec;
      --text: #1a1c1b;
      --muted: #68706c;
      --border: #e4e6e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    h1 {
      font-size: 22px;
      margin: 0;
      color: var(--accent);
    }
    .home-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--card-bg);
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 14px;
      transition: opacity 0.25s ease, transform 0.2s ease;
      position: relative;
      touch-action: pan-y;
      user-select: none;
    }
    .card.read {
      opacity: 0.48;
    }
    .card-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .pc-icons {
      display: flex;
      gap: 6px;
      padding-top: 2px;
      flex-shrink: 0;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--muted);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 0;
    }
    .icon-btn.active-read {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .icon-btn.active-fav {
      color: #d97706;
      border-color: #f59e0b;
      background: #fffbeb;
    }
    @media (hover: none) and (pointer: coarse) {
      .pc-icons {
        display: none;
      }
    }
    .card h2 {
      font-size: 17px;
      line-height: 1.35;
      margin: 0;
      color: var(--text);
    }
    .summary {
      font-size: 15px;
      line-height: 1.5;
      color: #2b302d;
      margin: 0 0 12px 0;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .orig-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .orig-link:hover {
      text-decoration: underline;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <a href="index.html" class="home-link">← На сайт</a>
        <h1>Новости</h1>
      </div>
      <div class="controls">
        <button class="tab-btn active" id="btn-all" onclick="setTab('all')">Все</button>
        <button class="tab-btn" id="btn-fav" onclick="setTab('fav')">Избранное (<span id="fav-count">0</span>)</button>
        <button class="tab-btn" id="btn-hide-read" onclick="toggleHideRead()">Скрыть прочитанные</button>
      </div>
    </header>
    <div id="list" class="empty">Загрузка новостей...</div>
  </div>

  <script>
    let allItems = [];
    let currentTab = 'all';
    let hideRead = false;

    const getReadIds = () => new Set(JSON.parse(localStorage.getItem('news_read_ids') || '[]'));
    const saveReadIds = (set) => localStorage.setItem('news_read_ids', JSON.stringify([...set]));

    const getFavItems = () => JSON.parse(localStorage.getItem('news_fav_items') || '{}');
    const saveFavItems = (obj) => localStorage.setItem('news_fav_items', JSON.stringify(obj));

    function toggleRead(id, forceRead = null) {
      const readSet = getReadIds();
      if (forceRead === true) {
        readSet.add(id);
      } else if (readSet.has(id)) {
        readSet.delete(id);
      } else {
        readSet.add(id);
      }
      saveReadIds(readSet);
      render();
    }

    function toggleFav(id) {
      const favs = getFavItems();
      if (favs[id]) {
        delete favs[id];
      } else {
        const item = allItems.find(x => (x.id || x.url) === id);
        if (item) favs[id] = item;
      }
      saveFavItems(favs);
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('btn-all').classList.toggle('active', tab === 'all');
      document.getElementById('btn-fav').classList.toggle('active', tab === 'fav');
      render();
    }

    function toggleHideRead() {
      hideRead = !hideRead;
      document.getElementById('btn-hide-read').classList.toggle('active', hideRead);
      render();
    }

    function render() {
      const container = document.getElementById('list');
      const readSet = getReadIds();
      const favs = getFavItems();
      document.getElementById('fav-count').textContent = Object.keys(favs).length;

      let sourceList = currentTab === 'fav' ? Object.values(favs) : allItems;
      if (hideRead && currentTab === 'all') {
        sourceList = sourceList.filter(item => !readSet.has(item.id || item.url));
      }

      if (!sourceList.length) {
        container.className = 'empty';
        container.textContent = currentTab === 'fav'
          ? 'В избранном пока пусто. Свайпните карточку справа налево (или нажмите ★ на ПК).'
          : 'Новостей пока нет.';
        return;
      }

      container.className = '';
      container.innerHTML = sourceList.map(item => {
        const id = item.id || item.url;
        const isRead = readSet.has(id);
        const isFav = Boolean(favs[id]);
        return `
          <article class="card ${isRead ? 'read' : ''}" data-id="${encodeURIComponent(id)}">
            <div class="card-meta">${item.source || 'Источник'} • ${item.date || ''}</div>
            <div class="title-row">
              <div class="pc-icons">
                <button class="icon-btn ${isRead ? 'active-read' : ''}" title="Прочитано" onclick="toggleRead(decodeURIComponent('${encodeURIComponent(id)}'))">✓</button>
                <button class="icon-btn ${isFav ? 'active-fav' : ''}" title="В избранное" onclick="toggleFav(decodeURIComponent('${encodeURIComponent(id)}'))">${isFav ? '★' : '☆'}</button>
              </div>
              <h2>${item.title}</h2>
            </div>
            <p class="summary">${item.summary}</p>
            <a href="${item.url}" target="_blank" rel="noopener" class="orig-link" onclick="toggleRead(decodeURIComponent('${encodeURIComponent(id)}'), true)">Читать оригинал →</a>
          </article>
        `;
      }).join('');

      attachSwipes();
    }

    function attachSwipes() {
      document.querySelectorAll('.card').forEach(card => {
        let startX = 0;
        let startY = 0;
        card.addEventListener('touchstart', e => {
          startX = e.changedTouches[0].clientX;
          startY = e.changedTouches[0].clientY;
        }, { passive: true });

        card.addEventListener('touchend', e => {
          const dx = e.changedTouches[0].clientX - startX;
          const dy = e.changedTouches[0].clientY - startY;
          if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            const id = decodeURIComponent(card.getAttribute('data-id'));
            if (dx > 0) {
              toggleRead(id);
            } else {
              toggleFav(id);
            }
          }
        }, { passive: true });
      });
    }

    async function init() {
      try {
        const res = await fetch('news.json?t=' + Date.now());
        allItems = await res.json();
      } catch (e) {
        allItems = [];
      }
      render();
    }
    init();
  </script>
</body>
</html>
